<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ToDo SaaS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container d-flex gap-3 align-items-center">
      <a class="navbar-brand" href="/">📝 ToDo SaaS</a>
      <form action="/search" method="GET" class="d-flex gap-2 ms-auto me-3">
        <input name="q" class="form-control form-control-sm"
               placeholder="Search tasks..." style="width:220px">
        <button class="btn btn-outline-light btn-sm">🔍</button>
      </form>
      <a class="btn btn-outline-light btn-sm" href="/stats">📊 Stats</a>
    </div>
  </nav>
  <div class="container">{% block content %}{% endblock %}</div>
</body>
</html>
